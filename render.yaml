services:
  - type: web
    name: ecolar-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ORACLE_URL
        sync: false
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: IA_BASE_URL
        sync: false
